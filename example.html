<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos - Master Your Time</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* * USER PROVIDED STYLES 
         * Implemented exactly as requested 
         */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap');

        @property --gradient-angle {
            syntax: "<angle>";
            initial-value: 0deg;
            inherits: false;
        }

        @property --gradient-angle-offset {
            syntax: "<angle>";
            initial-value: 0deg;
            inherits: false;
        }

        @property --gradient-percent {
            syntax: "<percentage>";
            initial-value: 20%;
            inherits: false;
        }

        @property --gradient-shine {
            syntax: "<color>";
            initial-value: #8484ff;
            inherits: false;
        }

        .shiny-cta {
            --gradient-angle: 0deg;
            --gradient-angle-offset: 0deg;
            --gradient-percent: 20%;
            --gradient-shine: #8484ff;
            --shadow-size: 2px;
            position: relative;
            overflow: hidden;
            border-radius: 9999px;
            padding: 1.25rem 2.5rem;
            font-size: 1.125rem;
            line-height: 1.2;
            font-weight: 500;
            color: #ffffff;
            background: linear-gradient(#000000, #000000) padding-box, conic-gradient(from calc(var(--gradient-angle) - var(--gradient-angle-offset)), transparent 0%, #1d4ed8 5%, var(--gradient-shine) 15%, #1d4ed8 30%, transparent 40%, transparent 100%) border-box;
            border: 2px solid transparent;
            box-shadow: inset 0 0 0 1px #1a1818;
            outline: none;
            transition: --gradient-angle-offset 800ms cubic-bezier(0.25, 1, 0.5, 1), --gradient-percent 800ms cubic-bezier(0.25, 1, 0.5, 1), --gradient-shine 800ms cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.3s;
            cursor: pointer;
            isolation: isolate;
            outline-offset: 4px;
            font-family: 'Inter', 'Helvetica Neue', sans-serif;
            z-index: 20;
            /* Increased z-index to sit above canvas */
            animation: border-spin 2.5s linear infinite;
        }

        @keyframes border-spin {
            to {
                --gradient-angle: 360deg;
            }
        }

        .shiny-cta:active {
            transform: translateY(1px);
        }

        .shiny-cta::before {
            content: '';
            pointer-events: none;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            --size: calc(100% - 6px);
            --position: 2px;
            --space: 4px;
            width: var(--size);
            height: var(--size);
            background: radial-gradient(circle at var(--position) var(--position), white 0.5px, transparent 0) padding-box;
            background-size: var(--space) var(--space);
            background-repeat: space;
            mask-image: conic-gradient(from calc(var(--gradient-angle) + 45deg), black, transparent 10% 90%, black);
            border-radius: inherit;
            opacity: 0.4;
            pointer-events: none;
        }

        .shiny-cta::after {
            content: '';
            pointer-events: none;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(-50deg, transparent, #1d4ed8, transparent);
            mask-image: radial-gradient(circle at bottom, transparent 40%, black);
            opacity: 0.6;
            animation: shimmer 4s linear infinite;
            animation-play-state: running;
        }

        .shiny-cta span {
            position: relative;
            z-index: 2;
            display: inline-block;
        }

        .shiny-cta span::before {
            content: '';
            pointer-events: none;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            --size: calc(100% + 1rem);
            width: var(--size);
            height: var(--size);
            box-shadow: inset 0 -1ex 2rem 4px #1d4ed8;
            opacity: 0;
            border-radius: inherit;
            transition: opacity 800ms cubic-bezier(0.25, 1, 0.5, 1);
            animation: breathe 4.5s linear infinite;
        }

        @keyframes shimmer {
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        @keyframes breathe {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) scale(1.20);
            }
        }

        /* * CHRONOS CUSTOM STYLES 
         */
        body {
            background-color: #020203;
            color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Subtle scanline/texture effect over background */
        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            z-index: 1;
            opacity: 0.4;
        }

        /* Bottom blue glow */
        .glow-bottom {
            position: fixed;
            bottom: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 120vw;
            height: 60vh;
            background: radial-gradient(circle, rgba(29, 78, 216, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        /* Text Gradient for "AI" */
        .text-gradient {
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .secondary-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            padding: 1.25rem 2.5rem;
            font-size: 1.125rem;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .secondary-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
            opacity: 0.3;
        }

        .nav-link {
            color: #9ca3af;
            transition: color 0.2s;
            font-size: 0.9rem;
        }

        .nav-link:hover {
            color: white;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col relative selection:bg-blue-500 selection:text-white">

    <!-- Dynamic Background Canvas (Matrix/Code effect) -->
    <canvas id="bgCanvas"></canvas>

    <!-- Noise Overlay -->
    <div class="bg-noise"></div>

    <!-- Bottom Glow -->
    <div class="glow-bottom"></div>

    <!-- Navigation -->
    <nav class="relative z-20 w-full px-6 py-6 flex justify-between items-center max-w-7xl mx-auto">
        <div class="flex items-center gap-2">
            <div
                class="w-8 h-8 bg-blue-700 rounded-full flex items-center justify-center text-white font-bold text-sm bg-opacity-20 border border-blue-500/30">
                C
            </div>
            <span class="font-semibold text-lg tracking-tight">Chronos</span>
        </div>
        <div class="hidden md:flex gap-8">
            <a href="#" class="nav-link">Product</a>
            <a href="#" class="nav-link">Manifesto</a>
            <a href="#" class="nav-link">Pricing</a>
            <a href="#" class="nav-link">Log in</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main
        class="relative z-20 flex-grow flex flex-col items-center justify-center text-center px-4 max-w-5xl mx-auto mt-[-4rem]">

        <!-- Hero Text -->
        <h1 class="text-5xl md:text-7xl font-medium tracking-tight leading-[1.1] mb-6 text-white/90">
            Where time meets <br />
            <span class="text-gradient">artificial intelligence</span>
        </h1>

        <p class="text-lg md:text-xl text-gray-400 max-w-2xl mb-12 leading-relaxed font-light">
            Chronos reconstructs your daily workflow using predictive AI,
            turning chaos into a perfectly synchronized schedule.
        </p>

        <!-- CTA Buttons -->
        <div class="flex flex-col sm:flex-row items-center gap-6">
            <!-- User Provided Shiny Button -->
            <button class="shiny-cta">
                <span>Try Chronos</span>
            </button>

            <!-- Secondary Button -->
            <button class="secondary-btn">
                See Demo
                <i data-lucide="play-circle" class="w-5 h-5 text-blue-400"></i>
            </button>
        </div>

    </main>

    <!-- Footer / Social Proof -->
    <footer class="relative z-20 py-8 w-full text-center">
        <p class="text-sm text-gray-600 uppercase tracking-widest mb-4 text-xs">Trusted by visionaries at</p>
        <div class="flex justify-center gap-8 opacity-40 grayscale">
            <!-- Simple text placeholders for logos to keep it clean/file-free -->
            <span class="font-bold text-lg">ACME</span>
            <span class="font-bold text-lg">Nebula</span>
            <span class="font-bold text-lg">Vertex</span>
            <span class="font-bold text-lg">Ouroboros</span>
        </div>
    </footer>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Canvas Animation Script
        // Recreates the "Matrix/Code" falling effect from the reference image
        // but subtly and with blue tones to match the Aura theme.
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        resize();

        // Characters to drop: 0, 1, and some time-related letters
        const chars = "01CHRONOSTIMEAIXY";
        const fontSize = 14;
        const columns = Math.floor(width / fontSize);

        // Array of drops - one per column
        const drops = [];
        for (let x = 0; x < columns; x++) {
            drops[x] = Math.random() * height; // Start at random heights
        }

        function draw() {
            // Semi-transparent black to create trail effect
            ctx.fillStyle = "rgba(2, 2, 3, 0.05)";
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = "#1d4ed8"; // Blue text (matches the CSS variable)
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                // Random character
                const text = chars.charAt(Math.floor(Math.random() * chars.length));

                // Draw the character
                // Vary opacity for depth
                const opacity = Math.random();
                if (opacity > 0.8) {
                    ctx.fillStyle = "#60a5fa"; // Lighter blue highlight
                } else {
                    ctx.fillStyle = "#172554"; // Dark blue fade
                }

                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                // Reset drop to top randomly after it has crossed screen
                if (drops[i] * fontSize > height && Math.random() > 0.975) {
                    drops[i] = 0;
                }

                // Increment Y coordinate
                drops[i]++;
            }
        }

        // Run animation
        setInterval(draw, 50);

    </script>
</body>

</html>
